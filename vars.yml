---
# ============================================================
# CephFS / Manila PSFS Variables
# Update these values before running the playbook
# ============================================================

# CephFS monitor IPs from OpenStack Manila export location
# Format: "ip1:port,ip2:port,ip3:port"
ceph_monitors: "172.31.x.x:6789,172.31.x.x:6789"

# CephFS share path from OpenStack Manila export location
# Found under: Project -> Share -> Shares -> Share Export Locations
ceph_share_path: "/volumes/_nogroup/share-xxxx-xxxx-xxxx-xxxx"

# Full export path (monitors + share path combined)
# Example: "172.31.x.x:6789,172.31.x.x:6789:/volumes/_nogroup/share-xxxx"
ceph_export_path: "{{ ceph_monitors }}:{{ ceph_share_path }}"

# cephx client username (must match the access rule created in Horizon)
ceph_client_name: "cwp-client"

# cephx access key (copied from Horizon after access rule becomes active)
ceph_access_key: "AQBxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx=="

# Mount point for the CephFS share
ceph_mount_point: "/mnt/psfs"

# CWP directories to bind mount from CephFS
bind_mounts:
  - src: "{{ ceph_mount_point }}/home"
    dest: "/home"
  - src: "{{ ceph_mount_point }}/var/www"
    dest: "/var/www"
  - src: "{{ ceph_mount_point }}/vhosts/apache"
    dest: "/usr/local/apache/conf/vhosts"
  - src: "{{ ceph_mount_point }}/vhosts/apache_ssl"
    dest: "/usr/local/apache/conf/vhosts_ssl"
  - src: "{{ ceph_mount_point }}/vhosts/nginx"
    dest: "/etc/nginx/conf.d"

# Directories to create on the CephFS share (run once on node1)
ceph_share_dirs:
  - "{{ ceph_mount_point }}/home"
  - "{{ ceph_mount_point }}/var/www"
  - "{{ ceph_mount_point }}/vhosts/apache"
  - "{{ ceph_mount_point }}/vhosts/apache_ssl"
  - "{{ ceph_mount_point }}/vhosts/nginx"

# Existing CWP directories to sync to CephFS before mounting
# src -> dest on CephFS
sync_dirs:
  - src: "/home/"
    dest: "{{ ceph_mount_point }}/home/"
  - src: "/var/www/"
    dest: "{{ ceph_mount_point }}/var/www/"
  - src: "/usr/local/apache/conf/vhosts/"
    dest: "{{ ceph_mount_point }}/vhosts/apache/"
  - src: "/usr/local/apache/conf/vhosts_ssl/"
    dest: "{{ ceph_mount_point }}/vhosts/apache_ssl/"
  - src: "/etc/nginx/conf.d/"
    dest: "{{ ceph_mount_point }}/vhosts/nginx/"
