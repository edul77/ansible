# inventory.ini
# Define your Ubuntu hosts here

[ubuntu_servers]
# Add your servers below. Examples:
# server1 ansible_host=192.168.1.10
# server2 ansible_host=192.168.1.11
# web01  ansible_host=10.0.0.5 ansible_user=ubuntu

[ubuntu_servers:vars]
ansible_user=ubuntu                        # Default SSH user for Ubuntu instances
ansible_ssh_private_key_file=~/.ssh/id_rsa # Key used for INITIAL connection (bootstrap key)
ansible_python_interpreter=/usr/bin/python3
