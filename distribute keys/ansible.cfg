# ansible.cfg
# Place this file in the same directory as your playbook.
# Ansible reads it automatically.

[defaults]
inventory          = inventory.ini
remote_user        = ubuntu
host_key_checking  = False          # Set True in production for security
retry_files_enabled = False
stdout_callback    = yaml           # Cleaner output
interpreter_python = auto_silent

[privilege_escalation]
become       = True
become_method = sudo
become_user  = root
become_ask_pass = False

[ssh_connection]
ssh_args          = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining        = True            # Speeds up playbook runs
control_path_dir  = /tmp/.ansible-cp
