---
# =============================================================================
# distribute_ssh_keys.yml
# Ansible Playbook: Distribute SSH Public Keys to Ubuntu Instances
# =============================================================================
# Usage:
#   ansible-playbook -i inventory.ini distribute_ssh_keys.yml
#   ansible-playbook -i inventory.ini distribute_ssh_keys.yml --tags add
#   ansible-playbook -i inventory.ini distribute_ssh_keys.yml --tags remove
#   ansible-playbook -i inventory.ini distribute_ssh_keys.yml -e "target_user=deploy"
# =============================================================================

- name: Distribute SSH public keys to Ubuntu instances
  hosts: ubuntu_servers
  become: true
  gather_facts: true

  vars:
    # -----------------------------------------------------------------------
    # Target user whose authorized_keys will be updated
    # Override with: -e "target_user=deploy"
    # -----------------------------------------------------------------------
    target_user: ubuntu

    # -----------------------------------------------------------------------
    # List of SSH public keys to add.
    # Each entry has:
    #   key   - the full public key string OR a path to a .pub file
    #   state - 'present' to add, 'absent' to remove
    #   comment - optional label shown in logs
    # -----------------------------------------------------------------------
    ssh_keys:
      - comment: "Admin key (from local file)"
        key: "{{ lookup('file', '/mnt/c/Users/UITS/.ssh/id_rsa.pub') }}"
        state: present

      # Example: inline key
      # - comment: "CI/CD deploy key"
      #   key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... ci@example.com"
      #   state: present

      # Example: key to remove
      # - comment: "Old developer key"
      #   key: "ssh-rsa AAAAB3NzaC1yc2EAAA... old-dev@example.com"
      #   state: absent

    # -----------------------------------------------------------------------
    # SSH hardening options (applied when harden_sshd is true)
    # -----------------------------------------------------------------------
    harden_sshd: false
    sshd_settings:
      PasswordAuthentication: "no"
      PermitRootLogin: "no"
      PubkeyAuthentication: "yes"
      AuthorizedKeysFile: ".ssh/authorized_keys"

  # =========================================================================
  # PRE-TASKS: Validate environment before making changes
  # =========================================================================
  pre_tasks:
    - name: Confirm target OS is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: "This playbook targets Ubuntu only. Found: {{ ansible_distribution }}"
        success_msg: "OS check passed: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Check that target user exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ target_user }}"
      register: user_info
      ignore_errors: true

    - name: Fail if target user does not exist
      ansible.builtin.fail:
        msg: >
          User '{{ target_user }}' does not exist on {{ inventory_hostname }}.
          Create the user first or set target_user to an existing account.
      when: user_info is failed

  # =========================================================================
  # TASKS
  # =========================================================================
  tasks:

    # -----------------------------------------------------------------------
    # 1. Ensure .ssh directory exists with correct permissions
    # -----------------------------------------------------------------------
    - name: Ensure .ssh directory exists for {{ target_user }}
      ansible.builtin.file:
        path: "/home/{{ target_user }}/.ssh"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0700"
      tags: [add, remove, setup]

    # -----------------------------------------------------------------------
    # 2. Ensure authorized_keys file exists
    # -----------------------------------------------------------------------
    - name: Ensure authorized_keys file exists
      ansible.builtin.file:
        path: "/home/{{ target_user }}/.ssh/authorized_keys"
        state: touch
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      tags: [add, remove, setup]

    # -----------------------------------------------------------------------
    # 3. Add or remove SSH keys
    # -----------------------------------------------------------------------
    - name: Manage SSH authorized keys for {{ target_user }}
      ansible.posix.authorized_key:
        user: "{{ target_user }}"
        key: "{{ item.key }}"
        state: "{{ item.state | default('present') }}"
        exclusive: false       
      loop: "{{ ssh_keys }}"
      loop_control:
        label: "{{ item.comment | default(item.key[:40] + '...') }}"
      tags: [add, remove]

    # -----------------------------------------------------------------------
    # 4. (Optional) SSH daemon hardening
    # -----------------------------------------------------------------------
    - name: Apply SSH daemon hardening settings
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?{{ item.key }}\\s"
        line: "{{ item.key }} {{ item.value }}"
        state: present
        validate: "/usr/sbin/sshd -t -f %s"
        backup: true
      loop: "{{ sshd_settings | dict2items }}"
      when: harden_sshd | bool
      notify: Restart SSH
      tags: [harden]

    # -----------------------------------------------------------------------
    # 5. Verify SSH service is running
    # -----------------------------------------------------------------------
    - name: Ensure SSH service is running and enabled
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true
      tags: [always]

  # =========================================================================
  # POST-TASKS: Verification
  # =========================================================================
  post_tasks:
    - name: Read authorized_keys content for audit
      ansible.builtin.slurp:
        src: "/home/{{ target_user }}/.ssh/authorized_keys"
      register: auth_keys_content
      tags: [always]

    - name: Show number of authorized keys on {{ inventory_hostname }}
      ansible.builtin.debug:
        msg: >
          Host {{ inventory_hostname }} | User: {{ target_user }} |
          authorized_keys lines: {{
            (auth_keys_content.content | b64decode).split('\n')
            | select('match', '^ssh-') | list | length
          }} key(s) configured.
      tags: [always]

  # =========================================================================
  # HANDLERS
  # =========================================================================
  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
